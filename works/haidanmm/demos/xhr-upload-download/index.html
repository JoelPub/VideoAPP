<!DOCTYPE html>
<html>
		<head>
			<script data-main="main" src="./function.js"></script>
		</head>
		<body>
			<div style="height:100px">
				<button class="btn" style="position: absolute;
													   width: 60px;
													   height: 20px;
													   background-color: #2db7f5;
													   color: #fff;
													   text-align: center;
													   font-weight: 900;
													   border-radius: 4px;padding-top: 0px;">浏览</button>
				<input type="file" id="file" name="file" class="file-uploads" onchange="selectFile()" style="position: absolute;
																						  display: block;
																						  width: 100px;
																						  height: 40px;
																						 opacity: 0;
																						 cursor: pointer;">
				<div class="file-name"  id="file-name"  style="position: absolute;
														  /*! top:40px; */
														  width: 100%;
														  height: 30px;
														  left: 80px;"></div>
				<button class="btn" onclick="downloadFile()" style="position: absolute;
													   width: 60px;
													   height: 20px;
													   background-color: #2db7f5;
													   color: #fff;
													   text-align: center;
													   font-weight: 900;
													   border-radius: 4px;padding-top: 0px;right:60px;">下载</button>
				<button class="btn" onclick="uploadFile()"  style="position: absolute;
													   width: 60px;
													   height: 20px;
													   background-color: #2db7f5;
													   color: #fff;
													   text-align: center;
													   font-weight: 900;
													   border-radius: 4px;padding-top: 0px;right:0px;">上传</button>
			</div>
			<progress id="progressBar" value="0" max="100" style="width:300px;"></progress>
			<h3 id="status"></h3>
			<p id="loaded_n_total"></p>
		</body>
</html>
