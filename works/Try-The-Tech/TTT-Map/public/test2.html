driving.setMarkersSetCallback(function(routes){//去掉默认起点和终点以及沿途的覆盖物？
    map.removeOverlay(routes[0].marker);
    map.removeOverlay(routes[routes.length-1].marker);

        var mm=routes[m].Nm;
        map.removeOverlay(mm)
    }
}) 
driving.setPolylinesSetCallback(function (lines) {
   //map.panto(center);
   let results = driving.getResults(); // 获取路线规划结果
   // getDistance(true) 获取距离 getDuration(true) 获取时间
   if (driving.getStatus() == BMAP_STATUS_SUCCESS){
        let journey = results.getPlan(0).getDistance(true);//得到距离
        console.log(journey);
        lines[0].getPolyline().setStrokeOpacity(0.0001);//隐藏默认路线
        //绘制阴影
        var pois5=[];
        var stepsnum1=lines[0].getNumSteps();
        for(var p=0;p<stepsnum1;p++){//关键点2
          var pp=lines[0].getStep(p).getPosition();
          console.log(map.pointToPixel(pp));
          pixelX=map.pointToPixel(pp).x+5;
          pixelY=map.pointToPixel(pp).y+10;
          pois5[p]=map.pixelToPoint(new BMap.Pixel(pixelX,pixelY));
        }
        var polyline5 =new BMap.Polyline(pois5, {
           enableEditing: false,//是否启用线编辑，默认为false
           enableClicking: true,//是否响应点击事件，默认为true
           icons:[icons],
           strokeWeight:'8',//折线的宽度，以像素为单位
           strokeOpacity: 0.8,//折线的透明度，取值范围0 - 1
           strokeColor:"#000" //折线颜色
        });
        map.addOverlay(polyline5);
        //使用自定义的起点
        changestartimg();
        //画路线
        changeRouteWeight(lines);


   }
})
driving.search(p1, p2);

function changestartimg() {
        function ComplexCustomOverlay(point, text, mouseoverText){
              this._point = point;
              this._text = text;
              this._overText = mouseoverText;
        }
        ComplexCustomOverlay.prototype = new BMap.Overlay();
        ComplexCustomOverlay.prototype.initialize = function(map){
          this._map = map;
          var div = this._div = document.createElement("div");
          div.style.position = "absolute";
          div.style.zIndex = BMap.Overlay.getZIndex(this._point.lat);
          div.style.backgroundColor = "#EE5D5B";
          div.style.border = "1px solid #BC3B3A";
          div.style.color = "white";
          div.style.height = "18px";
          div.style.padding = "2px";
          div.style.lineHeight = "18px";
          div.style.whiteSpace = "nowrap";
          div.style.MozUserSelect = "none";
          div.style.fontSize = "12px";
          div.style.opacity= "0";
          div.style.transition="all 5.0s ease-in-out";
          var span = this._span = document.createElement("span");
          div.appendChild(span);
          span.appendChild(document.createTextNode(this._text));
          var that = this;

          var arrow = this._arrow = document.createElement("div");
          arrow.style.background = "url(http://map.baidu.com/fwmap/upload/r/map/fwmap/static/house/images/label.png) no-repeat";
          arrow.style.position = "absolute";
          arrow.style.width = "11px";
          arrow.style.height = "100px";
          arrow.style.top = "22px";
          arrow.style.left = "10px";
          arrow.style.overflow = "hidden";
          div.appendChild(arrow);

          div.onmouseover = function(){
            this.style.backgroundColor = "#6BADCA";
            this.style.borderColor = "#0000ff";
            this.getElementsByTagName("span")[0].innerHTML = that._overText;
            arrow.style.backgroundPosition = "0px -20px";
          }

          div.onmouseout = function(){
            this.style.backgroundColor = "#EE5D5B";
            this.style.borderColor = "#BC3B3A";
            this.getElementsByTagName("span")[0].innerHTML = that._text;
            arrow.style.backgroundPosition = "0px 0px";
          }
          map.getPanes().labelPane.appendChild(div);

          return div;
        }
        ComplexCustomOverlay.prototype.draw = function(){
          var map = this._map;
          var pixel = map.pointToOverlayPixel(this._point);
          this._div.style.left = pixel.x - parseInt(this._arrow.style.left) + "px";
          this._div.style.top  = pixel.y - 30 + "px";
        }
        <!--ComplexCustomOverlay.prototype.addEventListener("click", function(){-->
            <!--console.log('hi');-->
        <!--});-->
        var txt = "银湖海岸城", mouseoverTxt = txt + " " + parseInt(Math.random() * 1000,10) + "套" ;

        var myCompOverlay = new ComplexCustomOverlay(new BMap.Point(121.464007,31.249602), "银湖海岸城",mouseoverTxt);

        map.addOverlay(myCompOverlay);

        var event = new Event('build');
        myCompOverlay.addEventListener('build', function (event) {
            this._div.style.opacity= "1";
            console.log(event)
        }, false);
        myCompOverlay.dispatchEvent(event);
}
